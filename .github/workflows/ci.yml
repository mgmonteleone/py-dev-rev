name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra mcp --python ${{ matrix.python-version }}

      - name: Verify uv is using the matrix interpreter
        run: |
          uv run --no-sync python -c "import sys; v='${{ matrix.python-version }}'; actual='.'.join(map(str, sys.version_info[:2])); assert actual == v, f'Expected Python {v}, got {actual}'"

      - name: Lint with Ruff
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Type check with mypy
        run: uv run --no-sync mypy src/

      - name: Validate AI documentation
        run: uv run --no-sync python scripts/build_ai_docs.py --verbose

      - name: Run tests (unit tests only)
        run: uv run --no-sync pytest --cov=src/devrev --cov-report=xml -v -m "not integration" --ignore=tests/performance

      - name: Run integration tests (if API token available)
        env:
          DEVREV_API_TOKEN: ${{ secrets.DEVREV_API_TOKEN }}
        run: |
          if [ -n "$DEVREV_API_TOKEN" ]; then
            uv run --no-sync pytest tests/integration/ -v -m integration --cov=src/devrev --cov-append --cov-report=xml
          else
            echo "Skipping integration tests - no API token available"
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

